<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frag Eichi!</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#3b2b1e;background:linear-gradient(#bde8f4 0 16%,#e5f1ca 46%,#b7dc7f);min-height:100vh}.app{max-width:1000px;margin:auto;padding:15px}.wood{background:linear-gradient(90deg,#d4a36a,#efcd95,#d5a46b);border:3px solid #936139;border-radius:17px;text-align:center;padding:11px;box-shadow:0 5px 13px #0002}h1{font-size:clamp(40px,6vw,61px);margin:0}.sub{font-size:20px}.intro{display:grid;grid-template-columns:110px 1fr;gap:15px;align-items:center;background:#fffdf7;border-radius:24px;padding:15px;margin:14px 0;box-shadow:0 6px 18px #0002}.sq{font-size:85px;text-align:center}.bubble{background:#edf7df;border:3px solid #80b45a;border-radius:21px;padding:15px;font-size:20px;line-height:1.42}.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}.topic{border:0;border-radius:15px;padding:10px 5px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 7px #0002}.topic span{display:block;font-size:29px}.topic:nth-child(8n+1){background:#8fd174}.topic:nth-child(8n+2){background:#f4b25b}.topic:nth-child(8n+3){background:#ef8377}.topic:nth-child(8n+4){background:#7bc9ed}.topic:nth-child(8n+5){background:#f2d16a}.topic:nth-child(8n+6){background:#bca1e4}.topic:nth-child(8n+7){background:#f1a9c2}.topic:nth-child(8n){background:#b7ded1}.chat{background:#fff;border-radius:24px;padding:15px;box-shadow:0 7px 20px #0002}.messages{height:450px;overflow:auto;background:#fbfaf3;border:2px solid #ded5c2;border-radius:18px;padding:14px}.msg{max-width:88%;padding:11px 14px;border-radius:18px;margin:9px 0;font-size:19px;line-height:1.44}.bot{background:#e0f2d3;border-bottom-left-radius:5px}.user{background:#dceefa;margin-left:auto;border-bottom-right-radius:5px}.who{font-size:12px;font-weight:bold;opacity:.65;margin-bottom:3px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.quick button{border:2px solid #d1b77e;background:#fff7e5;border-radius:18px;padding:8px 11px;font-weight:bold;cursor:pointer}.row{display:flex;gap:8px}.row input{flex:1;border:3px solid #baa98c;border-radius:15px;padding:13px;font-size:18px}.send{border:0;border-radius:15px;background:#69aa4c;color:#fff;font-size:18px;font-weight:bold;padding:10px 18px;cursor:pointer}.note{text-align:center;color:#6c5e4e;font-size:14px;margin-top:9px}@media(max-width:650px){.intro{grid-template-columns:75px 1fr}.sq{font-size:60px}.topics{grid-template-columns:repeat(2,1fr)}.messages{height:390px}.msg{max-width:95%}}
</style></head><body><main class="app">
<header class="wood"><h1>🐿️ Frag Eichi!</h1><div class="sub">Sprich mit einem Eichhörnchen</div></header>
<section class="intro"><div class="sq">🐿️</div><div class="bubble"><b>Hi, ich bin Eichi!</b> Frag mich ruhig so, wie du mit einem Eichhörnchen sprechen würdest. Schreibfehler sind kein Problem. 🌰</div></section>
<div class="topics" id="topics"></div><section class="chat"><div class="messages" id="messages"></div><div class="quick" id="quick"></div><div class="row"><input id="input" autocomplete="off" placeholder="Schreib Eichi etwas …"><button class="send" onclick="send()">Senden ➜</button></div><div class="note">💡 Schreib einfach in deinen eigenen Worten.</div></section></main>
<script>
const D={
food:{i:"🌰",n:"Futter",keys:["fress","friss","ess","hunger","futter","nahrung","nuss","eichel","beere","pilz","samen","knospe"],a:["Ich esse Nüsse, Samen, Eicheln, Beeren, Knospen und Pilze. 🌰 Manchmal fressen Eichhörnchen auch Insekten oder Würmer.","Mein Speiseplan ist größer als nur Nüsse. Je nach Jahreszeit finde ich verschiedene Pflanzenteile, Samen, Früchte und Pilze."],q:["Was könnte ich im Herbst als Vorrat verstecken?"]},
home:{i:"🏠",n:"Wohnen",keys:["wohn","zuhause","haus","nest","kobel","schlaf","wald","park","garten","baum"],a:["Ich lebe in Wäldern, Gärten und Parks mit Bäumen. 🌳 Mein Nest heißt <b>Kobel</b>.","Am Abend kehre ich in meinen Kobel zurück und schlafe dort. Bei starkem Regen, Sturm oder großer Kälte bleibe ich manchmal länger darin."],q:["Wie heißt mein Nest?"]},
typical:{i:"🌳",n:"Typisch Eichi",keys:["tagaktiv","nachtaktiv","kletter","einzelganger","allein","laut","tschuk","bewegung","verständ","kommun"],a:["Eichhörnchen sind geschickte Kletterer und verbringen viel Zeit auf Bäumen. Auf dem Boden sind sie vorsichtig und richten sich immer wieder auf, um Gefahren zu erkennen.","Ich bin <b>tagaktiv</b>: Tagsüber suche ich Futter, nachts schlafe ich meist im Kobel.","Eichhörnchen sind eigentlich Einzelgänger. Bei starker, anhaltender Kälte können sich aber mehrere Tiere einen Kobel teilen und sich gegenseitig wärmen.","Wir verständigen uns mit Lauten und Bewegungen. Ein typischer Ruf klingt etwa wie <b>„tschuk-tschuk“</b>."],q:["Bin ich eher am Tag oder in der Nacht unterwegs?"]},
spring:{i:"🌷",n:"Frühling",keys:["frühling","fruhling","frühjahr","fruhjahr","paarung","partner"],a:["Im Frühling suchen sich Eichhörnchen einen Partner. 🌷 Es kommt zur Paarung. Nach ungefähr <b>38 Tagen</b> können die Jungen zur Welt kommen.","Im Frühling beginnt bei Eichhörnchen die Zeit des Nachwuchses. Nach etwa 38 Tagen Tragzeit werden meist zwei bis fünf Junge geboren.","Im Frühling finde ich wieder frisches Futter wie Knospen, junge Triebe, Samen und Blüten. 🌱"],q:["Was passiert bei Eichhörnchen im Frühling?"]},
summer:{i:"☀️",n:"Sommer",keys:["sommer","sommerfell","aufzucht"],a:["Im Sommer sind Eichhörnchen-Mütter mit der Aufzucht ihrer Jungtiere beschäftigt. ☀️ Sie versorgen die Jungen und zeigen ihnen, was sie für ihr Leben brauchen.","Auch im Sommer kann ein Eichhörnchen-Weibchen noch einmal Junge bekommen. 🐣 Das Fell ist im Sommer meist heller als im Winter.","Im Sommer finde ich viele verschiedene Dinge zu fressen, zum Beispiel Beeren, Samen, Früchte und Pilze. ☀️"],q:["Womit sind Eichhörnchen-Mütter im Sommer beschäftigt?"]},
autumn:{i:"🍂",n:"Herbst",keys:["herbst","vorrat","vorräte","vorrate","sammel","vergrab","spalte","auspolster","winterfell"],a:["Im Herbst sammle ich Vorräte für den Winter. 🍂 Ich vergrabe Futter oder verstecke es in Spalten von Bäumen.","Im Herbst bereite ich mich auf den Winter vor: Ich sammle Futtervorräte, polstere meinen Kobel aus und bekomme mein Winterfell. 🌰🍂","Im Herbst fresse und sammle ich besonders Nüsse, Eicheln und Samen. Einen Teil verstecke ich für den Winter. 🌰"],q:["Warum verstecke ich im Herbst Futter?","Wie bereite ich meinen Kobel im Herbst auf den Winter vor?"]},
winter:{i:"❄️",n:"Winter",keys:["winter","schnee","kalt","frier","winterschlaf","winterruh"],a:["Im Winter halte ich <b>Winterruhe</b>, keinen durchgehenden Winterschlaf. ❄️ Ich wache zwischendurch auf und suche meine Futterverstecke.","Im Winter verbringe ich viel Zeit in meinem Kobel. Bei großer Kälte bleibe ich manchmal länger darin. Mein dichtes Winterfell hilft mir gegen die Kälte.","Im Winter suche ich meine im Herbst versteckten Vorräte, zum Beispiel Nüsse, Eicheln und Samen. ❄️🌰"],q:["Was mache ich im Winter?","Halte ich Winterschlaf oder Winterruhe?"]},
body:{i:"🐾",n:"Körper",keys:["schwanz","zahn","zahne","fell","kralle","ohr","pfote","korper","kletter","spring","farbe"],a:["Meine scharfen Krallen helfen beim Klettern. Mein buschiger Schwanz hilft beim Balancieren und Steuern und kann mich wärmen.","Meine Nagezähne wachsen immer wieder nach. 🦷","Das Fell des Europäischen Eichhörnchens kann rotbraun, dunkelbraun oder sogar schwarz sein. Im Sommer ist es meist heller als im Winter."],q:["Wozu brauche ich meinen buschigen Schwanz?"]},
babies:{i:"🐣",n:"Nachwuchs",keys:["baby","babys","junge","jungtier","mama","mutter","milch","geburt","blind","taub","nackt","tragend","38","woche","monat"],a:["Ein Weibchen kann zweimal im Jahr Junge bekommen. Es ist ungefähr <b>38 Tage</b> tragend. Oft kommen zwei bis fünf Junge zur Welt.","Bei der Geburt sind die Jungen nackt, blind und taub. Sie wiegen ungefähr <b>10 Gramm</b> und bleiben zuerst im Kobel. Die Mutter säugt sie mit Milch.","Nach etwa vier Wochen öffnen die Jungen ihre Augen. Mit ungefähr zwei Monaten verlassen sie erstmals das Nest. Mit etwa drei bis vier Monaten sind sie selbstständig.","Wenn sich die Mutter bedroht fühlt, kann sie mit ihren Jungen in einen anderen Kobel umziehen."],q:["Wie sehen Eichhörnchen-Babys direkt nach der Geburt aus?","Wann öffnen die Jungen ungefähr ihre Augen?"]},
danger:{i:"🦉",n:"Feinde",keys:["feind","gefahr","marder","baummarder","wiesel","luchs","habicht","uhu","falke","katze","krähe","krahe","bussard","waldohreule","mensch","spirale"],a:["Zu meinen Feinden gehören zum Beispiel Baummarder, Wiesel, Hauskatze und Luchs. Auch Habicht, Falke, Krähe, Uhu, Waldohreule und Bussard können gefährlich werden.","Bei einem Vogel als Verfolger kann ein Eichhörnchen spiralförmig um den Baumstamm laufen. So ist es immer wieder hinter dem Stamm versteckt und kann den Vogel verwirren.","Auch Menschen können zum Problem werden, wenn Lebensräume kleiner werden und Eichhörnchen weniger Platz finden."],q:["Welchen Trick kann ich benutzen, wenn mich ein Vogel verfolgt?"]},
family:{i:"🐿️",n:"Hörnchenfamilie",keys:["familie","hörnchen","hornchen","säugetier","saugetier","nagetier","streifenhörnchen","streifenhornchen","murmeltier","gleithörnchen","gleithornchen","arten","280","australien","antarktis"],a:["Unser heimisches Eichhörnchen ist ein <b>Säugetier</b>, gehört zur Familie der Hörnchen und zählt zu den Nagetieren.","Weltweit gibt es ungefähr <b>280 Arten von Hörnchen</b>. Bekannte Verwandte sind zum Beispiel Murmeltiere, Streifenhörnchen und Gleithörnchen.","Hörnchen gibt es fast überall auf der Welt. In Australien und in der Antarktis gibt es keine heimischen Hörnchenarten.","Gleithörnchen besitzen eine Gleithaut. Damit können manche von Ast zu Ast gleiten – bis ungefähr 50 Meter weit."],q:["Zu welcher Tiergruppe gehört das Eichhörnchen?","Kennst du einen Verwandten des Eichhörnchens?"]},
toilet:{i:"💩",n:"Kaka & Pipi",keys:["kaka","kack","kot","scheiss","scheiß","poop","pups","pipi","pink","urin","toilette","klo"],a:["😄 Natürlich mache ich Kaka und Pipi. Was mein Körper vom Futter nicht braucht, wird wieder ausgeschieden.","Ich brauche kein Menschenklo. Ich mache das draußen in meinem Lebensraum."],q:["Warum müssen Tiere überhaupt Kot ausscheiden?"]},
drink:{i:"💧",n:"Trinken",keys:["trink","durst","wasser","pfütze","bach","teich"],a:["Auch Eichhörnchen brauchen Wasser. 💧 Draußen können sie zum Beispiel an kleinen Gewässern oder Pfützen trinken."],q:["Wo könnte ich draußen Wasser finden?"]}
};
let last=null,count=0;
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function sim(a,b){if(a.includes(b)||b.includes(a))return true;if(a.length<4||b.length<4)return false;return lev(a,b)<=Math.max(1,Math.floor(Math.max(a.length,b.length)/4))}
function detect(s){let nn=norm(s);if(nn.includes("fruhling")||nn.includes("fruhjahr"))return "spring";if(nn.includes("sommer"))return "summer";if(nn.includes("herbst"))return "autumn";if(nn.includes("winter"))return "winter";let ws=nn.split(" "),best=null,score=0;for(let k in D){let sc=0;for(let x of ws)for(let y of D[k].keys)if(sim(x,norm(y))){sc+=x===norm(y)?4:2;break}if(sc>score){score=sc;best=k}}return score>=2?best:null}
function add(t,c="bot"){let d=document.createElement("div");d.className="msg "+c;d.innerHTML='<div class="who">'+(c==="bot"?"🐿️ Eichi":"Du")+"</div>"+t;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shouldAsk(){count++;return count%3===0 || Math.random()<.15}
function reply(k){last=k;let t=pick(D[k].a);if(shouldAsk()&&D[k].q.length)t+="<br><br><b>"+pick(D[k].q)+"</b>";add(t);buttons(k)}
function buttons(k){quick.innerHTML=(k?'<button onclick="more(\''+k+'\')">🌰 Erzähl mehr</button>':'')+'<button onclick="question()">🧠 Frag mich etwas</button><button onclick="topicsList()">🌳 Themen</button>'}
function more(k){reply(k)}
function question(){let ks=Object.keys(D),k=pick(ks);last=k;add("<b>"+pick(D[k].q)+"</b>");buttons(k)}
function topicsList(){add("<b>Worüber möchtest du sprechen?</b> Tippe oben auf ein Thema oder frag mich einfach.");buttons(null)}
function topic(k){add("Erzähl mir etwas über "+D[k].n+".","user");setTimeout(()=>reply(k),80)}
function special(s){let n=norm(s);
let foodWords=["ess","fress","friss","futter","nahrung","hunger","speise","isst","essen"];
let asksFood=foodWords.some(x=>n.includes(x));
if(asksFood&&(n.includes("fruhling")||n.includes("fruhjahr")))return "Im <b>Frühling</b> finde ich wieder mehr frisches Futter. 🌷 Ich knabbere zum Beispiel <b>Knospen, junge Triebe, Samen und Blüten</b>. Je nachdem, was ich finde, fresse ich auch anderes pflanzliches Futter.";
if(asksFood&&n.includes("sommer"))return "Im <b>Sommer</b> ist mein Speiseplan besonders abwechslungsreich. ☀️ Ich finde zum Beispiel <b>Beeren, Samen, Früchte, Knospen und Pilze</b>. Manchmal fressen Eichhörnchen auch kleine Insekten oder Würmer.";
if(asksFood&&n.includes("herbst"))return "Im <b>Herbst</b> gibt es für mich viel zu sammeln. 🍂🌰 Ich fresse und verstecke vor allem <b>Nüsse, Eicheln und Samen</b>. Einen Teil davon lege ich als Vorrat für den Winter an.";
if(asksFood&&n.includes("winter"))return "Im <b>Winter</b> finde ich weniger frisches Futter. ❄️ Deshalb suche ich meine im Herbst angelegten <b>Vorräte</b>, zum Beispiel Nüsse, Eicheln und Samen. Zwischendurch verlasse ich dafür meinen Kobel.";

if(n.includes("38")||((n.includes("wie lang")||n.includes("wie lange"))&&(n.includes("trag")||n.includes("schwanger"))))return "Ein Eichhörnchen-Weibchen ist ungefähr <b>38 Tage</b> tragend. Danach kommen meist zwei bis fünf Junge zur Welt. 🐣";
if((n.includes("wie viel")||n.includes("wieviel")||n.includes("wie schwer"))&&(n.includes("baby")||n.includes("jung")))return "Ein neugeborenes Eichhörnchen wiegt ungefähr <b>10 Gramm</b>. Es ist anfangs nackt, blind und taub.";
if(n.includes("auge")&&(n.includes("wann")||n.includes("woche")))return "Nach ungefähr <b>vier Wochen</b> öffnen junge Eichhörnchen ihre Augen. 👀";
if(n.includes("tschuk"))return "„Tschuk-tschuk“ ist ein typischer Laut von Eichhörnchen. 🐿️ Wir verständigen uns mit Lauten und Bewegungen.";
if((n.includes("tag")||n.includes("nacht"))&&(n.includes("aktiv")||n.includes("wach")))return "Eichhörnchen sind <b>tagaktiv</b>. Tagsüber suchen sie Futter und am Abend kehren sie meist in den Kobel zurück.";
if(n.includes("spiral")||((n.includes("vogel")||n.includes("habicht")||n.includes("falke"))&&(n.includes("flieh")||n.includes("trick")||n.includes("entkomm"))))return "Bei einem Vogel als Verfolger kann ich spiralförmig um den Baumstamm laufen. 🌳 So bin ich immer wieder hinter dem Stamm versteckt und kann den Vogel verwirren.";
if(n.includes("280"))return "Weltweit gibt es ungefähr <b>280 verschiedene Arten von Hörnchen</b>. Dazu gehören zum Beispiel Eichhörnchen, Murmeltiere, Streifenhörnchen und Gleithörnchen.";
if(n.includes("gleit")&&(n.includes("weit")||n.includes("meter")))return "Manche Gleithörnchen können mit ihrer Gleithaut ungefähr <b>50 Meter</b> weit von Ast zu Ast gleiten.";
if((n.includes("warum")||n.includes("wieso"))&&(n.includes("schwanz")||n.includes("buschig")))return "Mein buschiger Schwanz hilft beim Balancieren und Steuern und kann mich wärmen. 🐿️";
if((n.includes("schlaf")||n.includes("penn"))&&n.includes("winter"))return "Im Winter halte ich <b>Winterruhe</b>. Ich schlafe viel, wache aber zwischendurch auf und suche meine Futterverstecke.";
return null}
function send(){let s=input.value.trim();if(!s)return;add(s,"user");input.value="";setTimeout(()=>{let sp=special(s);if(sp){add(sp);buttons(last);return}let k=detect(s);if(k){reply(k);return}let n=norm(s);if(["hallo","hi","hey"].some(x=>n.includes(x))){add("Hi! 🐿️ Was möchtest du über mein Eichhörnchen-Leben wissen?");buttons(null);return}if(n.includes("danke")){add("Gerne! 🌰");buttons(last);return}if(last&&n.split(" ").length<10){add(pick(["Ah, ich verstehe, was du meinst. 👍","Gut mitgedacht!","Das ist ein interessanter Gedanke."])+" Wir können bei dem Thema bleiben oder du fragst mich etwas Neues über Eichhörnchen.");buttons(last);return}add("Das habe ich noch nicht ganz verstanden. 🐿️ Versuch es ruhig noch einmal. Frag mich etwas über Eichhörnchen, zum Beispiel über mein Jahr, meine Babys, Feinde oder meine Familie.");buttons(null)},80)}
topics.innerHTML=Object.keys(D).map(k=>'<button class="topic" onclick="topic(\''+k+'\')"><span>'+D[k].i+'</span>'+D[k].n+'</button>').join("");
input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
add("Hi! 🐿️ Ich bin <b>Eichi</b>. Du kannst mich ganz normal fragen – auch mit Schreibfehlern oder in Kindersprache. <b>Was möchtest du wissen?</b>");buttons(null);
</script></body></html>
