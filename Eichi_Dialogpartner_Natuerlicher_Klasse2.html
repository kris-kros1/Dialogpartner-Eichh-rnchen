<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frag Eichi!</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#3b2b1e;background:linear-gradient(#bde8f4 0 16%,#e5f1ca 46%,#b7dc7f);min-height:100vh}.app{max-width:1000px;margin:auto;padding:15px}.wood{background:linear-gradient(90deg,#d4a36a,#efcd95,#d5a46b);border:3px solid #936139;border-radius:17px;text-align:center;padding:11px;box-shadow:0 5px 13px #0002}h1{font-size:clamp(40px,6vw,61px);margin:0}.sub{font-size:20px}.intro{display:grid;grid-template-columns:110px 1fr;gap:15px;align-items:center;background:#fffdf7;border-radius:24px;padding:15px;margin:14px 0;box-shadow:0 6px 18px #0002}.sq{font-size:85px;text-align:center}.bubble{background:#edf7df;border:3px solid #80b45a;border-radius:21px;padding:15px;font-size:20px;line-height:1.42}.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}.topic{border:0;border-radius:15px;padding:10px 5px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 7px #0002}.topic span{display:block;font-size:29px}.topic:nth-child(8n+1){background:#8fd174}.topic:nth-child(8n+2){background:#f4b25b}.topic:nth-child(8n+3){background:#ef8377}.topic:nth-child(8n+4){background:#7bc9ed}.topic:nth-child(8n+5){background:#f2d16a}.topic:nth-child(8n+6){background:#bca1e4}.topic:nth-child(8n+7){background:#f1a9c2}.topic:nth-child(8n){background:#b7ded1}.chat{background:#fff;border-radius:24px;padding:15px;box-shadow:0 7px 20px #0002}.messages{height:450px;overflow:auto;background:#fbfaf3;border:2px solid #ded5c2;border-radius:18px;padding:14px}.msg{max-width:88%;padding:11px 14px;border-radius:18px;margin:9px 0;font-size:19px;line-height:1.44}.bot{background:#e0f2d3;border-bottom-left-radius:5px}.user{background:#dceefa;margin-left:auto;border-bottom-right-radius:5px}.who{font-size:12px;font-weight:bold;opacity:.65;margin-bottom:3px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.quick button{border:2px solid #d1b77e;background:#fff7e5;border-radius:18px;padding:8px 11px;font-weight:bold;cursor:pointer}.row{display:flex;gap:8px}.row input{flex:1;border:3px solid #baa98c;border-radius:15px;padding:13px;font-size:18px}.send{border:0;border-radius:15px;background:#69aa4c;color:#fff;font-size:18px;font-weight:bold;padding:10px 18px;cursor:pointer}.note{text-align:center;color:#6c5e4e;font-size:14px;margin-top:9px}@media(max-width:650px){.intro{grid-template-columns:75px 1fr}.sq{font-size:60px}.topics{grid-template-columns:repeat(2,1fr)}.messages{height:390px}.msg{max-width:95%}}
</style></head><body><main class="app">
<header class="wood"><h1>🐿️ Frag Eichi!</h1><div class="sub">Sprich mit einem Eichhörnchen</div></header>
<section class="intro"><div class="sq">🐿️</div><div class="bubble"><b>Hi, ich bin Eichi!</b> Frag mich ruhig so, wie du mit einem Eichhörnchen sprechen würdest. Auch „Wie machst du Kaka?“ oder „Hast du Zähne?“ ist völlig okay. 🌰</div></section>
<div class="topics" id="topics"></div><section class="chat"><div class="messages" id="messages"></div><div class="quick" id="quick"></div><div class="row"><input id="input" autocomplete="off" placeholder="Schreib Eichi etwas …"><button class="send" onclick="send()">Senden ➜</button></div><div class="note">💡 Schreib einfach in deinen eigenen Worten.</div></section></main>
<script>
const D={
food:{i:"🌰",n:"Futter",keys:["fress","friss","ess","hunger","futter","nahrung","nuss","eichel","beere","pilz","samen"],a:[
"Wenn ich Hunger habe, suche ich mir Futter. 🌰 Ich mag zum Beispiel Nüsse, Samen, Eicheln, Beeren, Knospen und Pilze. Aber Eichhörnchen fressen nicht nur Nüsse.",
"Ich knabbere ziemlich unterschiedliche Sachen. 😋 Je nach Jahreszeit finde ich zum Beispiel Samen, Nüsse, Beeren oder Pilze. Manchmal fressen Eichhörnchen sogar Insekten oder Würmer.",
"Ja, Nüsse mag ich – aber mein Speiseplan ist viel größer! 🌰 Besonders praktisch sind meine kräftigen Nagezähne zum Knabbern und Knacken."
],q:["Was würdest du einem Eichhörnchen lieber anbieten: eine Eichel oder ein Bonbon?","Welche Nahrung von meinem Speiseplan kennst du selbst?"]},
toilet:{i:"💩",n:"Kaka & Pipi",keys:["kaka","kack","kot","scheiss","scheiß","poop","pups","pipi","pink","urin","toilette","klo"],a:[
"😄 Ja, natürlich mache ich Kaka und Pipi! Auch Eichhörnchen müssen Verdautes wieder ausscheiden. Dafür brauche ich kein Klo wie ein Mensch – ich mache das draußen in meinem Lebensraum.",
"Klar! 💩 Was mein Körper vom Futter nicht braucht, wird wieder ausgeschieden. Eichhörnchen gehen dafür natürlich nicht auf eine Menschentoilette.",
"Auch bei mir wird Futter verdaut. 🐿️ Mein Körper nimmt daraus auf, was er braucht, und der Rest kommt als Kot wieder heraus. Pipi mache ich natürlich auch."
],q:["Warum müssen Tiere überhaupt Kot ausscheiden?"]},
home:{i:"🏠",n:"Wohnen",keys:["wohn","zuhause","haus","nest","kobel","schlaf","bett","wald","park","garten","baum"],a:[
"Mein Zuhause ist hoch oben im Baum. 🌳 Mein Nest heißt <b>Kobel</b>. Dort kann ich schlafen und mich schützen.",
"Ich brauche kein Haus mit Tür und Fenster. 😄 Eichhörnchen bauen einen Kobel hoch im Baum. Wälder, Parks und Gärten mit hohen Bäumen sind gute Lebensräume.",
"Zum Schlafen ziehe ich mich in meinen Kobel zurück. 🏠 Er ist ein geschützter Platz hoch im Baum."
],q:["Wie heißt mein Nest noch einmal?","Warum ist ein Platz hoch im Baum für mich praktisch?"]},
winter:{i:"❄️",n:"Winter",keys:["winter","schnee","kalt","frier","winterschlaf","winterruh","vorrat","versteck"],a:[
"Im Winter schlafe ich viel, aber nicht die ganze Zeit. ❄️ Eichhörnchen halten <b>Winterruhe</b>. Wenn ich Hunger bekomme, kann ich aufwachen und meine Vorräte suchen.",
"Mir hilft im Winter mein dichtes Fell, und mein buschiger Schwanz kann zusätzlich wärmen. 🐿️ Außerdem habe ich vorher Futter versteckt.",
"Nein, ich halte keinen durchgehenden Winterschlaf. Ich wache zwischendurch auf. Dann wird es Zeit, nach einem meiner Futterverstecke zu suchen. 🌰"
],q:["Was ist der Unterschied zwischen Winterruhe und Durchschlafen?","Warum verstecke ich schon im Herbst Futter?"]},
body:{i:"🐾",n:"Körper",keys:["schwanz","zahn","zahne","fell","kralle","ohr","pinsel","pfote","korper","gross","klein","lang","kletter","spring"],a:[
"Mein buschiger Schwanz kann ganz schön viel! 🐿️ Er hilft mir beim Steuern und Balancieren und kann mich auch wärmen.",
"Meine scharfen Krallen helfen mir, mich beim Klettern festzuhalten. 🐾 Das ist praktisch, wenn ich an Baumstämmen und Ästen unterwegs bin.",
"Meine Nagezähne wachsen immer wieder nach. 🦷 Das ist wichtig, weil ich viel nage und knacke.",
"Ein erwachsenes Eichhörnchen ist ungefähr 25 bis 30 Zentimeter lang – und dann kommt noch der lange, buschige Schwanz dazu."
],q:["Wozu könnte mein Schwanz beim Springen nützlich sein?","Was hilft mir dabei, an einem Baum festzuhalten?"]},
babies:{i:"🐣",n:"Babys",keys:["baby","babys","junge","jungtier","mama","mutter","milch","geburt","blind","taub","nackt"],a:[
"Eichhörnchen-Babys sind winzig. 🐣 Bei der Geburt sind sie nackt, blind und taub und wiegen ungefähr 10 Gramm.",
"Meine Jungen brauchen zuerst ganz viel Hilfe von ihrer Mutter. Sie bekommen Milch und bleiben geschützt im Kobel.",
"Mit ungefähr vier Monaten sind junge Eichhörnchen selbstständig. Vorher kümmert sich die Mutter um sie und bereitet sie auf das Leben draußen vor."
],q:["Warum können ganz junge Eichhörnchen noch nicht allein leben?"]},
danger:{i:"🦉",n:"Gefahren",keys:["feind","gefahr","angst","tot","fressfeind","marder","wiesel","luchs","habicht","uhu","falke","katze"],a:[
"Ich muss draußen aufmerksam sein. 🦉 Baummarder, Wiesel und manche Greifvögel können für Eichhörnchen gefährlich werden.",
"Wenn Gefahr droht, sind Bäume sehr wichtig. 🌳 Dort kann ich schnell klettern und versuchen, mich zu verstecken.",
"Auch Hauskatzen können Eichhörnchen gefährlich werden. Und wenn Menschen Lebensräume verändern, gibt es manchmal weniger Futter und weniger gute Plätze für Kobel."
],q:["Warum helfen mir hohe Bäume bei Gefahr?"]},
drink:{i:"💧",n:"Trinken",keys:["trink","durst","wasser","pfütze","bach","teich"],a:[
"Wenn ich Durst habe, trinke ich Wasser. 💧 Eichhörnchen können zum Beispiel an Pfützen, kleinen Bächen oder Teichen trinken.",
"Auch Eichhörnchen brauchen Wasser. 🐿️ Draußen finde ich es zum Beispiel in kleinen Gewässern oder Pfützen."
],q:["Wo könnte ein Eichhörnchen draußen Wasser finden?"]}
};
let last=null,count=0;
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function sim(a,b){if(a.includes(b)||b.includes(a))return true;if(a.length<4||b.length<4)return false;return lev(a,b)<=Math.max(1,Math.floor(Math.max(a.length,b.length)/4))}
function detect(s){let ws=norm(s).split(" "),best=null,score=0;for(let k in D){let sc=0;for(let x of ws)for(let y of D[k].keys)if(sim(x,norm(y))){sc+=x===norm(y)?4:2;break}if(sc>score){score=sc;best=k}}return score>=2?best:null}
function add(t,c="bot"){let d=document.createElement("div");d.className="msg "+c;d.innerHTML='<div class="who">'+(c==="bot"?"🐿️ Eichi":"Du")+"</div>"+t;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shouldAsk(){count++;return count%3===0 || Math.random()<.18}
function reply(k){last=k;let t=pick(D[k].a);if(shouldAsk()&&D[k].q.length)t+="<br><br><b>"+pick(D[k].q)+"</b>";add(t);buttons(k)}
function buttons(k){quick.innerHTML=(k?'<button onclick="more(\''+k+'\')">🌰 Erzähl mehr</button>':'')+'<button onclick="question()">🧠 Frag mich etwas</button><button onclick="topics()">🌳 Themen</button>'}
function more(k){reply(k)}
function question(){let ks=Object.keys(D),k=pick(ks);last=k;add("<b>"+pick(D[k].q)+"</b>");buttons(k)}
function topics(){add("<b>Worüber möchtest du mit mir sprechen?</b> 🌰 Futter, 💩 Kaka & Pipi, 🏠 Wohnen, ❄️ Winter, 🐾 Körper, 🐣 Babys, 🦉 Gefahren oder 💧 Trinken?");buttons(null)}
function topic(k){add("Erzähl mir etwas über "+D[k].n+".","user");setTimeout(()=>reply(k),80)}
function special(s){let n=norm(s);
if((n.includes("warum")||n.includes("wieso"))&&(n.includes("schwanz")||n.includes("buschig")))return "Mein buschiger Schwanz ist richtig praktisch. 🐿️ Er hilft mir beim Balancieren und Steuern, zum Beispiel beim Springen von Ast zu Ast. Außerdem kann er mich wärmen.";
if((n.includes("wie")||n.includes("wo"))&&(n.includes("kaka")||n.includes("kack")))return "😄 Ich mache Kaka draußen – ich habe natürlich kein Klo wie du. Mein Körper verdaut mein Futter. Was er nicht braucht, scheide ich als Kot wieder aus.";
if(n.includes("isst du")&&n.includes("nuss"))return "Ja, Nüsse gehören zu meinem Futter. 🌰 Aber ich esse nicht nur Nüsse: Auch Samen, Eicheln, Beeren, Knospen und Pilze stehen auf meinem Speiseplan.";
if((n.includes("hast du")||n.includes("haben"))&&(n.includes("zahn")||n.includes("zahne")))return "Ja! 🦷 Ich habe kräftige Nagezähne. Besonders spannend ist: Sie wachsen regelmäßig nach, weil sie beim Nagen stark benutzt werden.";
if((n.includes("schlaf")||n.includes("penn"))&&n.includes("winter"))return "Im Winter schlafe ich viel, aber nicht durchgehend. ❄️ Ich halte Winterruhe. Zwischendurch wache ich auf und suche Futter aus meinen Verstecken.";
return null}
function send(){let s=input.value.trim();if(!s)return;add(s,"user");input.value="";setTimeout(()=>{let sp=special(s);if(sp){add(sp);buttons(last);return}let k=detect(s);if(k){reply(k);return}let n=norm(s);
if(["hallo","hi","hey"].some(x=>n.includes(x))){add("Hi! 🐿️ Schön, dass du da bist. <b>Was möchtest du über mich wissen?</b>");buttons(null);return}
if(n.includes("danke")){add("Gerne! 🌰 Wir können noch weiter über Eichhörnchen reden.");buttons(last);return}
if(last && n.split(" ").length<10){add("Ich glaube, du antwortest gerade auf unser Gespräch. 👍 "+pick(["Das ist ein interessanter Gedanke.","Gut mitgedacht!","Ah, ich verstehe, was du meinst."])+" Wir können bei diesem Eichhörnchen-Thema bleiben oder über etwas anderes am Eichhörnchen sprechen.");buttons(last);return}
add("Das habe ich noch nicht ganz verstanden. 🐿️ Versuch es ruhig noch einmal mit deinen eigenen Worten. Du kannst mich auch ganz direkt fragen, zum Beispiel <b>„Wie machst du Kaka?“</b>, <b>„Was frisst du?“</b> oder <b>„Warum hast du so einen Schwanz?“</b>");buttons(null)},80)}
topics.innerHTML=Object.keys(D).map(k=>'<button class="topic" onclick="topic(\''+k+'\')"><span>'+D[k].i+'</span>'+D[k].n+'</button>').join("");
input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
add("Hi! 🐿️ Ich bin <b>Eichi</b>. Du kannst mich ganz normal fragen – auch in Kindersprache. <b>Was möchtest du über mein Eichhörnchen-Leben wissen?</b>");buttons(null);
</script></body></html>
